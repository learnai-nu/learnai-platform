<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="Bjælke der viser, at 36 procent af webshops er klar til agent-checkout, over et indkøbsflow med fire trin">
  <rect width="1536" height="1024" fill="#F5F3EE"/>
  <rect x="0" y="0" width="1536" height="1024" fill="none" stroke="#E7E5E3" stroke-width="2"/>
  <rect x="128" y="128" width="96" height="6" fill="#B98B4E"/>
  <text x="1408" y="186" text-anchor="end" font-family="Fraunces, Georgia, 'DejaVu Serif', serif" font-size="128" fill="#16283F" fill-opacity="0.08">41</text>

  <defs>
    <marker id="m41" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#57554F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- share of storefronts ready for agent checkout -->
  <rect x="238" y="300" width="1060" height="44" rx="22" fill="#E7E5E3"/>
  <rect x="238" y="300" width="382" height="44" rx="22" fill="#004FA6"/>
  <text x="238" y="440" font-family="Fraunces, Georgia, 'DejaVu Serif', serif" font-size="80" fill="#16283F">36&#8201;%</text>

  <!-- the purchase flow an agent has to complete -->
  <g stroke="#57554F" stroke-width="4" stroke-linecap="round" marker-end="url(#m41)">
    <line x1="462" y1="716" x2="560" y2="716"/>
    <line x1="742" y1="716" x2="840" y2="716"/>
    <line x1="1022" y1="716" x2="1120" y2="716"/>
  </g>
  <g fill="#E8F1FE" stroke="#004FA6" stroke-width="5">
    <rect x="238" y="628" width="208" height="176" rx="28"/>
    <rect x="518" y="628" width="208" height="176" rx="28"/>
    <rect x="798" y="628" width="208" height="176" rx="28"/>
  </g>
  <rect x="1078" y="628" width="208" height="176" rx="28" fill="#F5F3EE" stroke="#E7E5E3" stroke-width="5"/>
  <g fill="#004FA6">
    <circle cx="342" cy="716" r="22"/><circle cx="622" cy="716" r="22"/><circle cx="902" cy="716" r="22"/>
  </g>
  <g stroke="#B98B4E" stroke-width="6" stroke-linecap="round">
    <line x1="1152" y1="686" x2="1212" y2="746"/>
    <line x1="1212" y1="686" x2="1152" y2="746"/>
  </g>
</svg>
