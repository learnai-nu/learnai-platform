<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="Fire rækker lærende, hvor alle nu har adgang til den samme model, markeret med ens blå felter">
  <rect width="1536" height="1024" fill="#F5F3EE"/>
  <rect x="0" y="0" width="1536" height="1024" fill="none" stroke="#E7E5E3" stroke-width="2"/>
  <rect x="128" y="128" width="96" height="6" fill="#B98B4E"/>
  <text x="1408" y="186" text-anchor="end" font-family="Fraunces, Georgia, 'DejaVu Serif', serif" font-size="128" fill="#16283F" fill-opacity="0.08">41</text>

  <!-- the model everyone now reaches -->
  <circle cx="768" cy="332" r="76" fill="#004FA6"/>
  <circle cx="768" cy="332" r="28" fill="#E8F1FE"/>
  <line x1="300" y1="470" x2="1236" y2="470" stroke="#B98B4E" stroke-width="4"/>
  <g stroke="#E7E5E3" stroke-width="4" stroke-linecap="round">
    <line x1="768" y1="408" x2="768" y2="470"/>
  </g>

  <!-- every learner reaches the same model; what differs is what they do with it -->
  <g stroke="#E7E5E3" stroke-width="4" stroke-linecap="round">
    <line x1="372" y1="470" x2="372" y2="568"/>
    <line x1="570" y1="470" x2="570" y2="568"/>
    <line x1="768" y1="470" x2="768" y2="568"/>
    <line x1="966" y1="470" x2="966" y2="568"/>
    <line x1="1164" y1="470" x2="1164" y2="568"/>
  </g>
  <g fill="#E8F1FE" stroke="#004FA6" stroke-width="5">
    <rect x="296" y="568" width="152" height="152" rx="26"/>
    <rect x="494" y="568" width="152" height="152" rx="26"/>
    <rect x="692" y="568" width="152" height="152" rx="26"/>
    <rect x="890" y="568" width="152" height="152" rx="26"/>
    <rect x="1088" y="568" width="152" height="152" rx="26"/>
  </g>

  <!-- what each one makes of it differs -->
  <g fill="#004FA6">
    <rect x="296" y="784" width="152" height="40" rx="20"/>
    <rect x="494" y="784" width="152" height="104" rx="20"/>
    <rect x="692" y="784" width="152" height="64" rx="20"/>
    <rect x="890" y="784" width="152" height="128" rx="20"/>
    <rect x="1088" y="784" width="152" height="84" rx="20"/>
  </g>
</svg>
