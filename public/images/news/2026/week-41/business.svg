<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="To søjlepar der viser prisen pr. million tokens: input falder fra 1,00 til 0,10 dollar og output fra 5,00 til 0,50 dollar">
  <rect width="1536" height="1024" fill="#F5F3EE"/>
  <rect x="0" y="0" width="1536" height="1024" fill="none" stroke="#E7E5E3" stroke-width="2"/>
  <rect x="128" y="128" width="96" height="6" fill="#B98B4E"/>
  <text x="1408" y="186" text-anchor="end" font-family="Fraunces, Georgia, 'DejaVu Serif', serif" font-size="128" fill="#16283F" fill-opacity="0.08">41</text>

  <!-- baseline -->
  <line x1="208" y1="760" x2="1328" y2="760" stroke="#16283F" stroke-width="4"/>

  <!-- 96 px per dollar per million tokens; old price greige, new price blue -->
  <g>
    <path d="M 300 760 v -96 a 8 8 0 0 1 8 -8 h 112 a 8 8 0 0 1 8 8 v 96 Z" fill="#E7E5E3"/>
    <path d="M 452 760 v -10 a 8 8 0 0 1 8 -8 h 112 a 8 8 0 0 1 8 8 v 10 Z" fill="#004FA6"/>
    <path d="M 884 760 v -480 a 8 8 0 0 1 8 -8 h 112 a 8 8 0 0 1 8 8 v 480 Z" fill="#E7E5E3"/>
    <path d="M 1036 760 v -48 a 8 8 0 0 1 8 -8 h 112 a 8 8 0 0 1 8 8 v 48 Z" fill="#004FA6"/>
  </g>

  <g font-family="Fraunces, Georgia, 'DejaVu Serif', serif" font-size="46" fill="#16283F" text-anchor="middle">
    <text x="364" y="614">1,00</text>
    <text x="516" y="700">0,10</text>
    <text x="948" y="230">5,00</text>
    <text x="1092" y="662">0,50</text>
  </g>
  <g font-family="Geist, 'DejaVu Sans', sans-serif" font-size="34" font-weight="700" fill="#57554F" text-anchor="middle">
    <text x="440" y="836">input</text>
    <text x="1024" y="836">output</text>
  </g>
  <!-- legend: which price is which model -->
  <g>
    <rect x="300" y="892" width="36" height="36" rx="8" fill="#E7E5E3"/>
    <text x="352" y="921" font-family="Geist, 'DejaVu Sans', sans-serif" font-size="32" fill="#57554F">Haiku 4.5</text>
    <rect x="560" y="892" width="36" height="36" rx="8" fill="#004FA6"/>
    <text x="612" y="921" font-family="Geist, 'DejaVu Sans', sans-serif" font-size="32" fill="#57554F">Haiku 5.5</text>
  </g>
</svg>
