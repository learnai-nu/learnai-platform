<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="Tidslinje for ugens AI-lanceringer med fem nedslag mellem 14. og 18. september, hvor det sidste er fremhævet">
  <rect width="1536" height="1024" fill="#F5F3EE"/>
  <rect x="0" y="0" width="1536" height="1024" fill="none" stroke="#E7E5E3" stroke-width="2"/>
  <rect x="128" y="128" width="96" height="6" fill="#B98B4E"/>
  <text x="1408" y="186" text-anchor="end" font-family="Fraunces, Georgia, 'DejaVu Serif', serif" font-size="128" fill="#16283F" fill-opacity="0.08">38</text>

  <!-- release tiles, all the same size: emphasis never comes from length -->
  <g>
    <rect x="212" y="360" width="160" height="220" rx="20" fill="#F5F3EE" stroke="#E7E5E3" stroke-width="5"/>
    <rect x="236" y="362" width="112" height="10" rx="5" fill="#004FA6"/>
    <rect x="452" y="360" width="160" height="220" rx="20" fill="#F5F3EE" stroke="#E7E5E3" stroke-width="5"/>
    <rect x="476" y="362" width="112" height="10" rx="5" fill="#004FA6"/>
    <rect x="692" y="360" width="160" height="220" rx="20" fill="#F5F3EE" stroke="#E7E5E3" stroke-width="5"/>
    <rect x="716" y="362" width="112" height="10" rx="5" fill="#004FA6"/>
    <rect x="932" y="360" width="160" height="220" rx="20" fill="#F5F3EE" stroke="#E7E5E3" stroke-width="5"/>
    <rect x="956" y="362" width="112" height="10" rx="5" fill="#004FA6"/>
    <rect x="1172" y="360" width="160" height="220" rx="20" fill="#E8F1FE" stroke="#B98B4E" stroke-width="5"/>
    <rect x="1196" y="362" width="112" height="10" rx="5" fill="#004FA6"/>
  </g>

  <!-- stems, uniform length -->
  <g stroke="#E7E5E3" stroke-width="5" stroke-linecap="round">
    <line x1="292" y1="580" x2="292" y2="712"/>
    <line x1="532" y1="580" x2="532" y2="712"/>
    <line x1="772" y1="580" x2="772" y2="712"/>
    <line x1="1012" y1="580" x2="1012" y2="712"/>
  </g>
  <line x1="1252" y1="580" x2="1252" y2="712" stroke="#B98B4E" stroke-width="5" stroke-linecap="round"/>

  <!-- rail -->
  <line x1="180" y1="712" x2="1356" y2="712" stroke="#E7E5E3" stroke-width="4" stroke-linecap="round"/>
  <line x1="292" y1="712" x2="1252" y2="712" stroke="#004FA6" stroke-width="4" stroke-linecap="round"/>

  <!-- date nodes -->
  <g font-family="Geist, 'DejaVu Sans', sans-serif" font-size="40" font-weight="700" fill="#16283F" text-anchor="middle">
    <circle cx="292" cy="712" r="18" fill="#F5F3EE" stroke="#004FA6" stroke-width="7"/>
    <circle cx="532" cy="712" r="18" fill="#F5F3EE" stroke="#004FA6" stroke-width="7"/>
    <circle cx="772" cy="712" r="18" fill="#F5F3EE" stroke="#004FA6" stroke-width="7"/>
    <circle cx="1012" cy="712" r="18" fill="#F5F3EE" stroke="#004FA6" stroke-width="7"/>
    <circle cx="1252" cy="712" r="34" fill="#004FA6"/>
    <text x="292" y="816">14</text>
    <text x="532" y="816">15</text>
    <text x="772" y="816">17</text>
    <text x="1012" y="816">17</text>
    <text x="1252" y="830">18</text>
  </g>
</svg>
