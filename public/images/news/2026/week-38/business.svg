    <path d="M 344 316 h 112 v 32 a 8 8 0 0 1 -8 8 h -96 a 8 8 0 0 1 -8 -8 Z"/>
    <path d="M 712 316 h 112 v 237 a 8 8 0 0 1 -8 8 h -96 a 8 8 0 0 1 -8 -8 Z"/>
    <path d="M 1080 316 h 112 v 424 a 8 8 0 0 1 -8 8 h -96 a 8 8 0 0 1 -8 -8 Z"/>
  </g>

  <g font-family="Fraunces, Georgia, 'DejaVu Serif', serif" font-size="56" fill="#16283F" text-anchor="middle">
    <text x="400" y="432">&#8722;0,56&#8201;%</text>
    <text x="768" y="637">&#8722;3,4&#8201;%</text>
    <text x="1136" y="824">&#8776;&#8201;&#8722;6&#8201;%</text>
  </g>
</svg>
